# On-demand installable debug build for FilmCraft's Kotlin + Rust Android app.
# Keep this independent of release.yml and its production signing keys.
name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/apk-build-request.txt'
      - '.github/workflows/apk-build.yml'

permissions:
  contents: read

concurrency:
  group: filmcraft-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Kotlin + Rust debug APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project's Rust toolchain
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: filmcraft-debug-arm64

      - name: Install cargo-ndk and Android NDK 29
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"

      - name: Build Kotlin and Rust debug APK
        working-directory: apps/filmcraft-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug "-Pfilmcraft.abis=arm64-v8a" --no-daemon --stacktrace

      - name: Verify generated debug APK
        run: |
          apk="apps/filmcraft-android/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify "$apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-debug-arm64-apk
          path: apps/filmcraft-android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
